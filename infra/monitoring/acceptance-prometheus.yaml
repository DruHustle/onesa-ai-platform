global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/alerts.yaml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: onesa-api
    authorization: {type: Bearer, credentials_file: /run/secrets/metrics_token}
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]
  - job_name: onesa-operations
    authorization: {type: Bearer, credentials_file: /run/secrets/operations_token}
    metrics_path: /metrics
    static_configs:
      - targets: [operations:9000]
