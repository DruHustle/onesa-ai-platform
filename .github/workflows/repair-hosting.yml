name: Repair existing hosting configuration
on:
  workflow_dispatch:
    inputs:
      staging_action:
        description: Isolated AI staging operation
        type: choice
        default: inspect
        options: [inspect, database-probe, configure-preview, deploy-preview]
permissions:
  contents: read
  actions: read
concurrency:
  group: hosting-configuration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_BACKEND_SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
      RENDER_WORKER_SERVICE_ID: ${{ secrets.RENDER_WORKER_SERVICE_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install staging database diagnostic dependencies
        if: github.ref == 'refs/heads/staging'
        run: python -m pip install -r onesa-ai-platform-backend/requirements.lock
      - name: Inspect only the authorized AI staging service
        if: github.ref == 'refs/heads/staging' && inputs.staging_action != 'deploy-preview'
        run: python scripts/staging.py "${{ inputs.staging_action }}"
      - name: Require successful CI on the current staging revision
        if: inputs.staging_action == 'deploy-preview'
        uses: actions/github-script@v7
        with:
          script: |
            if (context.ref !== 'refs/heads/staging') throw new Error('Preview requires staging');
            const {owner, repo} = context.repo;
            const ref = await github.rest.git.getRef({owner, repo, ref: 'heads/staging'});
            if (ref.data.object.sha !== context.sha) throw new Error('Staging revision changed');
            for (const workflow_id of ['ci.yml', 'repository-hygiene.yml']) {
              const runs = await github.rest.actions.listWorkflowRuns({owner, repo, workflow_id, head_sha: context.sha, event: 'push', per_page: 20});
              const run = runs.data.workflow_runs[0];
              if (!run || run.status !== 'completed' || run.conclusion !== 'success') {
                throw new Error(`${workflow_id} must pass before Preview deployment`);
              }
            }
      - name: Verify protected project and configure staging-only routing
        if: github.ref == 'refs/heads/staging' && inputs.staging_action == 'deploy-preview'
        run: python scripts/staging.py configure-preview
      - uses: actions/setup-node@v4
        if: github.ref == 'refs/heads/staging' && inputs.staging_action == 'deploy-preview'
        with: {node-version: '24'}
      - name: Build and deploy protected Preview only
        if: github.ref == 'refs/heads/staging' && inputs.staging_action == 'deploy-preview'
        run: |
          npm install --global vercel@63.1.0
          vercel pull --yes --environment=preview --git-branch=staging --token="$VERCEL_TOKEN"
          vercel build --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --token="$VERCEL_TOKEN" --meta githubCommitRef=staging --meta githubCommitSha="$GITHUB_SHA" > /tmp/vercel-staging-url.txt
          cat /tmp/vercel-staging-url.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Read configuration and deployment status without revealing credentials
        if: github.ref != 'refs/heads/staging'
        run: python scripts/repair_hosting.py
      - name: Read back repaired configuration
        if: github.ref != 'refs/heads/staging'
        run: python scripts/inspect_hosting.py
