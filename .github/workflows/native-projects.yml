name: Native AI projects
on:
  pull_request:
    paths:
      - 'onesa-ai-platform-frontend/apps/mobile/**'
      - 'onesa-ai-platform-frontend/packages/api-client/**'
      - 'docs/api/openapi.json'
      - '.github/workflows/native-projects.yml'
  push:
    branches: [dev, staging, main]
    paths:
      - 'onesa-ai-platform-frontend/apps/mobile/**'
      - 'onesa-ai-platform-frontend/packages/api-client/**'
      - 'docs/api/openapi.json'
      - '.github/workflows/native-projects.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-ai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
jobs:
  source:
    name: Native source and platform bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: onesa-ai-platform-frontend/apps/mobile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npm run export
      - run: npx --no-install expo prebuild --no-install --template ./node_modules/expo/template.tgz
      - name: Verify both generated project identities
        run: |
          test -f ios/OnesaAIPlatform.xcodeproj/project.pbxproj
          test -f android/app/src/main/AndroidManifest.xml
          node scripts/check-native-projects.mjs
  android:
    name: Android native debug build
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    defaults:
      run:
        working-directory: onesa-ai-platform-frontend/apps/mobile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - run: npx --no-install expo prebuild --platform android --no-install --template ./node_modules/expo/template.tgz
      - name: Prepare SDK matching the pinned React Native build
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006'
          if [[ ! -e "$ANDROID_HOME/platforms/android-37" ]]; then ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"; fi
      - name: Compile native app without store credentials
        run: ./android/gradlew -p android :app:assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2 --no-parallel -Dorg.gradle.jvmargs=-Xmx4g --console=plain
  ios:
    name: iOS native unsigned simulator build
    needs: source
    runs-on: macos-26
    timeout-minutes: 70
    defaults:
      run:
        working-directory: onesa-ai-platform-frontend/apps/mobile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
      - run: npm ci --ignore-scripts
      - run: npx --no-install expo prebuild --platform ios --no-install --template ./node_modules/expo/template.tgz
      - run: pod install --project-directory=ios
      - name: Compile unsigned simulator application
        run: >-
          xcodebuild -workspace ios/OnesaAIPlatform.xcworkspace
          -scheme OnesaAIPlatform -configuration Release
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/onesa-ai-native-derived"
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
