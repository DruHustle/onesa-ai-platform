name: Approved staging qualification
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: approved-staging-deployment
  cancel-in-progress: false
jobs:
  staging:
    if: always() && (github.event.repository.private == false || needs.local-validation.result == 'success') && (github.repository == 'DruHustle/onesa-ai-platform'
      && github.actor == 'DruHustle' && github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: srv-db56mju7bikc73950f60
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      STAGING_MIGRATION_DATABASE_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}
      STAGING_FIXTURES_JSON: ${{ secrets.STAGING_FIXTURES_JSON }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Require successful exact-source checks and approved target
      run: 'python3 scripts/release/evidence.py stage-preflight --output "$RUNNER_TEMP/technical/record.json"

        python3 scripts/release/hosted.py preflight'
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Build protected staging Preview with existing branch settings
      env:
        STAGING_BRANCH: staging
      run: 'npm install --global vercel@63.1.0

        vercel pull --yes --environment=preview --git-branch="$STAGING_BRANCH" --token="$VERCEL_TOKEN"

        VERCEL=1 vercel build --token="$VERCEL_TOKEN"

        vercel deploy --prebuilt --token="$VERCEL_TOKEN" --meta githubCommitRef="$STAGING_BRANCH" --meta githubCommitSha="$GITHUB_SHA" > /tmp/vercel-url.txt'
    - name: Bind only the approved staging API origin to this verified Preview
      run: python3 scripts/release/hosted.py bind-staging-origin
    - name: Deploy exact staging backend source without database migration
      run: python3 scripts/deploy_render.py
      env:
        RENDER_RECEIPT_PATH: ${{ runner.temp }}/render/record.json
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run existing synthetic hosted authentication, isolation and restart acceptance
      env:
        RENDER_RECEIPT_PATH: ${{ runner.temp }}/render/record.json
      run: 'make install

        cp /tmp/vercel-url.txt /tmp/vercel-staging-url.txt

        .venv/bin/python scripts/staging_acceptance.py

        node scripts/staging_ui.cjs'
      if: env.STAGING_FIXTURES_JSON == ''
    - name: Verify authenticated synthetic workflows, storage and actual inference where applicable
      run: python3 scripts/release/hosted_suite.py
    - name: Capture provider identity and real hosted probes
      run: python3 scripts/release/hosted.py stage --evidence "$RUNNER_TEMP/technical/record.json" --render-receipt "$RUNNER_TEMP/render/record.json"
        --output "$RUNNER_TEMP/staging/record.json"
    - uses: actions/upload-artifact@v4
      with:
        name: staging-verification
        path: ${{ runner.temp }}/staging/record.json
        retention-days: 7
        if-no-files-found: error
    - name: Report outstanding acceptance honestly
      run: python3 -c 'import json,os; from pathlib import Path; r=json.loads((Path(os.environ["RUNNER_TEMP"])/"staging/record.json").read_text());
        print("Hosted qualification:",r["status"]); print(json.dumps(r["checks"],indent=2))'
    - name: Remove private synthetic fixture credentials
      if: always()
      run: rm -f -- /tmp/onesa-staging-acceptance-users.json
    environment: Staging
    needs: local-validation
  local-validation:
    if: github.event.repository.private == true && github.repository == 'DruHustle/onesa-ai-platform' && github.actor == 'DruHustle'
    uses: ./.github/workflows/_local-validation.yml
