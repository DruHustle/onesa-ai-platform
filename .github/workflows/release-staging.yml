name: Approved staging qualification
'on': # zizmor: ignore[dangerous-triggers] -- Owner exact main SHA and complete CI before staging-only credentials; documented in CI_CD_PIPELINE_REPORT.md
  workflow_dispatch:
    inputs:
      context_diagnostic:
        description: Two-call synthetic context diagnostic on the existing deployment; no deployment or qualification
        type: boolean
        default: false
      deployed_commit:
        description: Exact already-live staging commit required for context diagnostics
        type: string
      fixture_mode:
        type: choice
        default: temporary
        options:
        - temporary
        - provided
  workflow_call:
    inputs:
      context_diagnostic:
        type: boolean
        default: false
      deployed_commit:
        type: string
      fixture_mode:
        type: string
        default: temporary
    secrets:
      STAGING_FIXTURES_JSON:
        required: true
      STAGING_MIGRATION_DATABASE_URL:
        required: true
      STAGING_RENDER_API_KEY:
        required: true
      STAGING_RENDER_SERVICE_ID:
        required: true
      STAGING_VERCEL_AUTOMATION_BYPASS_SECRET:
        required: true
      STAGING_VERCEL_ORG_ID:
        required: true
      STAGING_VERCEL_PROJECT_ID:
        required: true
      STAGING_VERCEL_TOKEN:
        required: true
  workflow_run:
    workflows:
    - Platform checks
    types:
    - completed
    branches:
    - main
permissions:
  contents: read
  actions: read
concurrency:
  group: approved-staging-deployment
  cancel-in-progress: false
jobs:
  staging:
    if: (github.event.repository.private == false || vars.ONESA_PRIVATE_HOSTED_VALIDATION_ENABLED == 'true') && ((vars.STAGING_SECRET_SCOPE != 'environment' || github.event.repository.private == true) && (github.repository == 'DruHustle/onesa-ai-platform' && github.actor == 'DruHustle' && github.triggering_actor == 'DruHustle' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging') || (github.event_name == 'workflow_run' && github.event.repository.private == true && vars.STAGING_AUTOMATION_ENABLED == 'true' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_sha == github.sha && github.event.workflow_run.conclusion == 'success'))))
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps: &staging_steps
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
        fetch-depth: 0
    - name: Require successful exact-source checks before provider credentials
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/release/evidence.py stage-preflight --output "$RUNNER_TEMP/technical/record.json"
    - name: Verify isolated provider targets
      env:
        RENDER_API_KEY: ${{ secrets.STAGING_RENDER_API_KEY }}
        RENDER_SERVICE_ID: ${{ secrets.STAGING_RENDER_SERVICE_ID }}
        VERCEL_TOKEN: ${{ secrets.STAGING_VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.STAGING_VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
        VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.STAGING_VERCEL_AUTOMATION_BYPASS_SECRET }}
        STAGING_MIGRATION_DATABASE_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}
        STAGING_FIXTURES_JSON: ${{ secrets.STAGING_FIXTURES_JSON }}
      run: python3 scripts/release/hosted.py preflight
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
    - name: Reuse the exact-source protected native Git Preview
      if: inputs.context_diagnostic != true
      env:
        RENDER_API_KEY: ${{ secrets.STAGING_RENDER_API_KEY }}
        RENDER_SERVICE_ID: ${{ secrets.STAGING_RENDER_SERVICE_ID }}
        VERCEL_TOKEN: ${{ secrets.STAGING_VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.STAGING_VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
        VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.STAGING_VERCEL_AUTOMATION_BYPASS_SECRET }}
        STAGING_FIXTURES_JSON: ${{ secrets.STAGING_FIXTURES_JSON }}
      run: python3 scripts/release/hosted.py resolve-preview --url-file /tmp/vercel-url.txt
    - name: Bind only the approved staging API origin to this verified Preview
      if: inputs.context_diagnostic != true
      run: python3 scripts/release/hosted.py bind-staging-origin
      env:
        RENDER_API_KEY: ${{ secrets.STAGING_RENDER_API_KEY }}
        RENDER_SERVICE_ID: ${{ secrets.STAGING_RENDER_SERVICE_ID }}
        VERCEL_TOKEN: ${{ secrets.STAGING_VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.STAGING_VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
        VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.STAGING_VERCEL_AUTOMATION_BYPASS_SECRET }}
        STAGING_MIGRATION_DATABASE_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}
        STAGING_FIXTURES_JSON: ${{ secrets.STAGING_FIXTURES_JSON }}
    - name: Deploy exact staging backend source without database migration
      id: backend
      if: inputs.context_diagnostic != true
      run: python3 scripts/deploy_render.py
      env:
        RENDER_RECEIPT_PATH: ${{ runner.temp }}/render/record.json
        RENDER_API_KEY: ${{ secrets.STAGING_RENDER_API_KEY }}
        RENDER_SERVICE_ID: ${{ secrets.STAGING_RENDER_SERVICE_ID }}
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'
    - name: Run existing synthetic hosted authentication, isolation and restart acceptance
      env:
        RENDER_RECEIPT_PATH: ${{ runner.temp }}/render/record.json
        RENDER_API_KEY: ${{ secrets.STAGING_RENDER_API_KEY }}
        RENDER_SERVICE_ID: ${{ secrets.STAGING_RENDER_SERVICE_ID }}
        VERCEL_TOKEN: ${{ secrets.STAGING_VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.STAGING_VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
        VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.STAGING_VERCEL_AUTOMATION_BYPASS_SECRET }}
        STAGING_MIGRATION_DATABASE_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}
        STAGING_FIXTURES_JSON: ${{ secrets.STAGING_FIXTURES_JSON }}
      run: 'make install

        cp /tmp/vercel-url.txt /tmp/vercel-staging-url.txt

        .venv/bin/python scripts/staging_acceptance.py'
      if: inputs.context_diagnostic != true && env.STAGING_FIXTURES_CONFIGURED != 'true'
    - name: Install locked staging fixture tooling
      run: make install
    - name: Install the existing locked hosted browser tooling
      if: inputs.context_diagnostic != true
      run: |
        npm --prefix onesa-ai-platform-frontend run ci
        npm --prefix onesa-ai-platform-frontend/apps/chat exec -- playwright install --with-deps chromium
    - name: Verify the existing deployment before diagnostic fixture creation
      if: inputs.context_diagnostic == true
      run: .venv/bin/python scripts/release/context_diagnostic.py verify
      env: &diagnostic_env
        AI_CONTEXT_DIAGNOSTIC: ${{ inputs.context_diagnostic }}
        AI_DIAGNOSTIC_DEPLOYED_COMMIT: ${{ inputs.deployed_commit }}
        RENDER_API_KEY: ${{ secrets.STAGING_RENDER_API_KEY }}
        RENDER_SERVICE_ID: ${{ secrets.STAGING_RENDER_SERVICE_ID }}
        VERCEL_TOKEN: ${{ secrets.STAGING_VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.STAGING_VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
        VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.STAGING_VERCEL_AUTOMATION_BYPASS_SECRET }}
        STAGING_FIXTURES_JSON: ${{ secrets.STAGING_FIXTURES_JSON }}
    - name: Create only temporary approved synthetic staging identities
      if: inputs.fixture_mode != 'provided'
      run: .venv/bin/python scripts/release/fixture_lifecycle.py create
      env:
        RENDER_API_KEY: ${{ secrets.STAGING_RENDER_API_KEY }}
        RENDER_SERVICE_ID: ${{ secrets.STAGING_RENDER_SERVICE_ID }}
        VERCEL_TOKEN: ${{ secrets.STAGING_VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.STAGING_VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
        VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.STAGING_VERCEL_AUTOMATION_BYPASS_SECRET }}
        STAGING_FIXTURES_JSON: ${{ secrets.STAGING_FIXTURES_JSON }}
    - name: Verify authenticated synthetic workflows, storage and actual inference where applicable
      if: inputs.context_diagnostic != true
      run: .venv/bin/python scripts/release/hosted_suite.py
      env:
        RENDER_API_KEY: ${{ secrets.STAGING_RENDER_API_KEY }}
        RENDER_SERVICE_ID: ${{ secrets.STAGING_RENDER_SERVICE_ID }}
        VERCEL_TOKEN: ${{ secrets.STAGING_VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.STAGING_VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
        VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.STAGING_VERCEL_AUTOMATION_BYPASS_SECRET }}
        STAGING_MIGRATION_DATABASE_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}
        STAGING_FIXTURES_JSON: ${{ secrets.STAGING_FIXTURES_JSON }}
    - name: Diagnose two actual application context calls without full qualification
      if: inputs.context_diagnostic == true
      run: .venv/bin/python scripts/release/context_diagnostic.py probe
      env: *diagnostic_env
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always() && inputs.context_diagnostic == true
      with:
        name: staging-context-diagnostic
        path: ${{ runner.temp }}/context-diagnostic/record.json
        retention-days: 3
        if-no-files-found: warn
    - name: Verify actual protected interfaces, live appearance, streaming and Stop
      if: inputs.context_diagnostic != true
      run: node scripts/staging_ui.cjs
      env:
        VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
        VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.STAGING_VERCEL_AUTOMATION_BYPASS_SECRET }}
        STAGING_FIXTURES_JSON: ${{ secrets.STAGING_FIXTURES_JSON }}
    - name: Capture provider identity and real hosted probes
      if: always() && steps.backend.outcome == 'success'
      run: python3 scripts/release/hosted.py stage --evidence "$RUNNER_TEMP/technical/record.json" --render-receipt "$RUNNER_TEMP/render/record.json"
        --output "$RUNNER_TEMP/staging/record.json"
      env:
        RENDER_API_KEY: ${{ secrets.STAGING_RENDER_API_KEY }}
        RENDER_SERVICE_ID: ${{ secrets.STAGING_RENDER_SERVICE_ID }}
        VERCEL_TOKEN: ${{ secrets.STAGING_VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.STAGING_VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
        VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.STAGING_VERCEL_AUTOMATION_BYPASS_SECRET }}
        STAGING_MIGRATION_DATABASE_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}
        STAGING_FIXTURES_JSON: ${{ secrets.STAGING_FIXTURES_JSON }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always() && steps.backend.outcome == 'success'
      with:
        name: staging-verification
        path: ${{ runner.temp }}/staging/record.json
        retention-days: 7
        if-no-files-found: error
    - name: 'Release requirement: actual hosted staging acceptance'
      if: inputs.context_diagnostic != true
      run: python3 scripts/release/hosted.py stage-result --evidence "$RUNNER_TEMP/staging/record.json"
    - name: Remove private synthetic fixture credentials
      if: always()
      run: rm -f -- /tmp/onesa-staging-acceptance-users.json
    - name: Disable only this run's synthetic identities and remove private credentials
      if: always() && inputs.fixture_mode != 'provided'
      run: test ! -f "$RUNNER_TEMP/onesa-private-staging-fixtures.json" || .venv/bin/python scripts/release/fixture_lifecycle.py cleanup
      env:
        RENDER_API_KEY: ${{ secrets.STAGING_RENDER_API_KEY }}
        RENDER_SERVICE_ID: ${{ secrets.STAGING_RENDER_SERVICE_ID }}
        VERCEL_TOKEN: ${{ secrets.STAGING_VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.STAGING_VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
        VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.STAGING_VERCEL_AUTOMATION_BYPASS_SECRET }}
        STAGING_FIXTURES_JSON: ${{ secrets.STAGING_FIXTURES_JSON }}
    env: &staging_env
      GH_TOKEN: ${{ github.token }}
      STAGING_FIXTURE_MODE: ${{ inputs.fixture_mode || 'temporary' }}
      STAGING_FIXTURES_CONFIGURED: ${{ secrets.STAGING_FIXTURES_JSON != '' }}
  staging-environment:
    # Optional verified public-environment binding; private Free always uses repository secrets.
    if: (github.event.repository.private == false || vars.ONESA_PRIVATE_HOSTED_VALIDATION_ENABLED == 'true') && ((vars.STAGING_SECRET_SCOPE == 'environment' && github.event.repository.private == false) && (github.repository == 'DruHustle/onesa-ai-platform' && github.actor == 'DruHustle' && github.triggering_actor == 'DruHustle' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging') || (github.event_name == 'workflow_run' && github.event.repository.private == true && vars.STAGING_AUTOMATION_ENABLED == 'true' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_sha == github.sha && github.event.workflow_run.conclusion == 'success'))))
    environment: Staging
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps: *staging_steps
    env: *staging_env
