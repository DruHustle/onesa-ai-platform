name: Temporary audit lockfile inspection
on:
  push:
    branches:
      - 'dependabot/npm_and_yarn/onesa-ai-platform-frontend/apps/chat/next-16.4.5'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Resolve only npm-audited lockfile changes
        working-directory: onesa-ai-platform-frontend/apps/chat
        run: |
          npm --version
          npm audit fix --package-lock-only --ignore-scripts --no-fund
          npm audit --audit-level=high --package-lock-only
      - name: Display generated public lockfile in reviewable chunks
        if: always()
        working-directory: onesa-ai-platform-frontend/apps/chat
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const text=fs.readFileSync('package-lock.json','utf8');
          console.log('LOCKFILE_DATA_BEGIN');
          for(let i=0;i<text.length;i+=1500) console.log('LOCKFILE_DATA_CHUNK:'+JSON.stringify(text.slice(i,i+1500)));
          console.log('LOCKFILE_DATA_END');
          NODE
