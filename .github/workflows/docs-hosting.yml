# Public: hosted only. Private: full local validation precedes cloud execution.
name: Public documentation hosting
permissions:
  contents: read
concurrency:
  group: public-documentation-hosting
  cancel-in-progress: false
'on':
  workflow_dispatch:
    inputs:
      target:
        description: Build artifact, Vercel preview, or public docs production
        type: choice
        options:
        - build
        - preview
        - production
        default: build
      create_project:
        description: Create the separate onesa-docs project if it does not exist
        type: boolean
        default: false
      docs_url:
        description: Owner-selected public documentation origin
        default: https://docs.onesa.eu
        required: true
      application_url:
        description: Application origin linked from the documentation
        default: https://platform.onesa.eu
        required: true
jobs:
  local-validation:
    if: ${{ github.event.repository.private == true && github.repository == 'DruHustle/onesa-ai-platform' && github.actor == 'DruHustle' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'DruHustle')) }}
    uses: ./.github/workflows/_local-validation.yml
  documentation:
    name: docs-hosting
    if: ${{ always() && (github.event.repository.private == false || needs.local-validation.result == 'success') && (inputs.target != 'production' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ONESA_DOCS_SCOPE: public
      ONESA_DOCS_STATIC_HOSTING: 'true'
      ONESA_DOCS_URL: ${{ inputs.docs_url }}
      ONESA_APPLICATION_URL: ${{ inputs.application_url }}
      ONESA_DOCS_API_URL: ''
    steps:
    - name: Verify GitHub-hosted execution and actual visibility
      env:
        GH_TOKEN: ${{ github.token }}
        EXPECTED_PRIVATE: ${{ github.event.repository.private }}
      run: |-
        test "$RUNNER_ENVIRONMENT" = github-hosted
        actual=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')
        test "$actual" = "$EXPECTED_PRIVATE" || { echo 'Visibility changed; dispatch fresh validation under the current policy'; exit 1; }
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Install locked build dependencies
      run: |
        make install
        python3 -m unittest discover -s scripts/docs -p 'test_*.py'
        npm --prefix onesa-ai-platform-frontend/apps/docs ci
        npm --prefix onesa-ai-platform-frontend/apps/chat ci
        cd onesa-ai-platform-frontend/apps/docs
        npx playwright install --with-deps chromium
    - name: Read reviewed cross-project source revisions
      id: docs-sources
      run: |
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        revisions=json.loads(Path('docs/ecosystem/source-revisions.json').read_text())
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('portal=' + revisions['onesa-company-portal']['commit'] + '\n')
            output.write('robot=' + revisions['onesa-ai-robot']['commit'] + '\n')
        PY
    - uses: actions/checkout@v4
      if: github.event.repository.private == false
      with:
        repository: DruHustle/onesa-company-portal
        ref: ${{ steps.docs-sources.outputs.portal }}
        path: data/docs-sources/portal
        persist-credentials: false
    - uses: actions/checkout@v4
      if: github.event.repository.private == false
      with:
        repository: DruHustle/onesa-ai-robot
        ref: ${{ steps.docs-sources.outputs.robot }}
        path: data/docs-sources/robot
        persist-credentials: false
    - name: Verify pinned Portal and Robot source contracts
      if: github.event.repository.private == false
      run: .venv/bin/python scripts/docs/ecosystem.py --portal data/docs-sources/portal --robot data/docs-sources/robot
    - name: Capture fresh synthetic application screenshots
      run: |
        python3 scripts/bootstrap_env.py
        ONESA_CHAT_PORT=3100 ONESA_PUBLIC_ORIGIN=http://localhost:3100 docker compose up --build --wait
        node scripts/docs/capture.mjs
    - name: Verify dependency security and build classified public documentation
      run: |
        npm --prefix onesa-ai-platform-frontend/apps/docs run test:security
        npm --prefix onesa-ai-platform-frontend/apps/docs audit --audit-level=low
        make docs-assets docs-public
        .venv/bin/python scripts/docs/validate.py --staged
        git diff --exit-code -- docs/api/openapi.json docs/diagrams/database.mmd docs/public/examples.md docs/database/SCHEMA.md
    - name: Verify public documentation interactions and accessibility
      run: node scripts/docs/acceptance.mjs
    - name: Verify emitted favicon link and bundled icon
      run: |
        python3 - <<'PYTHON'
        from html.parser import HTMLParser
        from pathlib import Path
        class Icons(HTMLParser):
            found = False
            def handle_starttag(self, tag, attrs):
                attrs = dict(attrs)
                if tag == 'link' and attrs.get('rel') == 'icon' and attrs.get('href') == '/favicon.ico':
                    self.found = True
        app = Path('onesa-ai-platform-frontend/apps/docs')
        parser = Icons()
        parser.feed((app / 'build-public/index.html').read_text())
        assert parser.found, 'Public index is missing the favicon link'
        icon = (app / 'build-public/favicon.ico').read_bytes()
        assert icon == (app / 'static/favicon.ico').read_bytes()
        assert icon[:4] == b'\x00\x00\x01\x00', 'Invalid ICO header'
        print('Public index favicon link and bundled image verified.')
        PYTHON
    - name: Stop isolated screenshot fixture
      if: always()
      run: docker compose down
    - name: Upload public site only
      uses: actions/upload-artifact@v4
      with:
        name: onesa-public-docs-staging
        path: onesa-ai-platform-frontend/apps/docs/build-public/
        if-no-files-found: error
        retention-days: 7
    - name: Inspect existing public docs project and source revisions
      if: inputs.target != 'build'
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_DOCS_PROJECT_ID: ${{ secrets.VERCEL_DOCS_PROJECT_ID }}
      run: .venv/bin/python scripts/docs/vercel_host.py inspect | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Prepare separate Vercel documentation project
      if: inputs.target != 'build'
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_DOCS_PROJECT_ID: ${{ secrets.VERCEL_DOCS_PROJECT_ID }}
        APPLICATION_VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        DOCS_DEPLOY_DIRECTORY: ${{ runner.temp }}/onesa-docs
        CREATE_PROJECT: ${{ inputs.create_project }}
      run: |
        flags=()
        if [ "$CREATE_PROJECT" = true ]; then flags+=(--create); fi
        .venv/bin/python scripts/docs/vercel_host.py prepare "${flags[@]}"
    - name: Publish verified public build to Vercel
      if: inputs.target != 'build'
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        DEPLOY_TARGET: ${{ inputs.target }}
      run: |
        set -eu
        mkdir -p "$RUNNER_TEMP/onesa-docs/.vercel/output/static"
        cp onesa-ai-platform-frontend/apps/docs/vercel.json "$RUNNER_TEMP/onesa-docs/vercel.json"
        cp -a onesa-ai-platform-frontend/apps/docs/build-public/. "$RUNNER_TEMP/onesa-docs/.vercel/output/static/"
        python3 - <<'PYTHON'
        import json, os
        from pathlib import Path
        routes = []
        if os.environ['DEPLOY_TARGET'] == 'preview':
            routes.append({'src': '/(.*)', 'headers': {'X-Robots-Tag': 'noindex, nofollow'}, 'continue': True})
        routes.extend([{'handle': 'filesystem'}, {'src': '/((?:[^/]+/)*[^/.]+)', 'dest': '/$1.html'}, {'src': '/.*', 'dest': '/404.html', 'status': 404}])
        path = Path(os.environ['RUNNER_TEMP']) / 'onesa-docs/.vercel/output/config.json'
        path.write_text(json.dumps({'version': 3, 'routes': routes}) + '\n')
        PYTHON
        cd "$RUNNER_TEMP/onesa-docs"
        flags=()
        if [ "$DEPLOY_TARGET" = production ]; then flags+=(--prod); fi
        npm exec --yes --package=vercel@63.1.0 -- vercel deploy --prebuilt --yes --meta onesaSourceRevision="$GITHUB_SHA" "${flags[@]}" --token="$VERCEL_TOKEN" > "$RUNNER_TEMP/onesa-docs-url.txt"
        cat "$RUNNER_TEMP/onesa-docs-url.txt" >> "$GITHUB_STEP_SUMMARY"
    - name: Verify actual deployment identity, readiness and source revision
      if: inputs.target != 'build'
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_DOCS_PROJECT_ID: ${{ secrets.VERCEL_DOCS_PROJECT_ID }}
        APPLICATION_VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      run: |
        export DOCS_DEPLOYMENT_URL="$(cat "$RUNNER_TEMP/onesa-docs-url.txt")"
        .venv/bin/python scripts/docs/vercel_host.py verify-deployment | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Verify hosted public documentation behavior
      if: inputs.target == 'production'
      run: ONESA_DOCS_TEST_URL=https://docs.onesa.eu node scripts/docs/acceptance.mjs
    - name: Read existing public domain assignment and DNS requirements
      if: inputs.target == 'production'
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        DOCS_DEPLOY_DIRECTORY: ${{ runner.temp }}/onesa-docs
      run: .venv/bin/python scripts/docs/vercel_host.py domain | tee -a "$GITHUB_STEP_SUMMARY"
    needs:
    - local-validation
