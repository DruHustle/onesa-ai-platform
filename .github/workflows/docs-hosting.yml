name: Public documentation hosting
permissions:
  contents: read
concurrency:
  group: public-documentation-hosting
  cancel-in-progress: false
'on':
  workflow_dispatch:
    inputs:
      target:
        description: Build artifact, Vercel preview, or public docs production
        type: choice
        options:
        - build
        - preview
        - production
        default: build
      create_project:
        description: Create the separate onesa-docs project if it does not exist
        type: boolean
        default: false
      docs_url:
        description: Owner-selected public documentation origin
        default: https://docs.onesa.eu
        required: true
      application_url:
        description: Application origin linked from the documentation
        default: https://platform.onesa.eu
        required: true
jobs:
  documentation:
    name: docs-hosting
    if: ${{ github.event.repository.private == false && (always() && true && (inputs.target != 'production' || github.ref
      == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ONESA_DOCS_SCOPE: public
      ONESA_DOCS_STATIC_HOSTING: 'true'
      ONESA_DOCS_URL: ${{ inputs.docs_url }}
      ONESA_APPLICATION_URL: ${{ inputs.application_url }}
      ONESA_DOCS_API_URL: ''
    steps:
    - name: Verify GitHub-hosted execution and actual visibility
      env:
        GH_TOKEN: ${{ github.token }}
        EXPECTED_PRIVATE: ${{ github.event.repository.private }}
      run: 'test "$RUNNER_ENVIRONMENT" = github-hosted

        actual=$(gh api "repos/$GITHUB_REPOSITORY" --jq ''.private'')

        test "$actual" = "$EXPECTED_PRIVATE" || { echo ''Visibility changed; dispatch fresh validation under the current policy'';
        exit 1; }'
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: 'false'
        ref: ${{ github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '24'
    - name: Install locked build dependencies
      run: 'make install

        npm --prefix onesa-ai-platform-frontend/apps/docs ci

        cd onesa-ai-platform-frontend/apps/docs

        npx playwright install --with-deps chromium

        '
    - name: Capture fresh synthetic application screenshots
      run: 'python3 scripts/bootstrap_env.py

        ONESA_CHAT_PORT=3100 ONESA_PUBLIC_ORIGIN=http://localhost:3100 docker compose up --build --wait

        node scripts/docs/capture.mjs

        '
    - name: Verify dependency security and build classified public documentation
      run: 'npm --prefix onesa-ai-platform-frontend/apps/docs run test:security

        npm --prefix onesa-ai-platform-frontend/apps/docs audit --audit-level=low

        make docs-assets docs-public

        .venv/bin/python scripts/docs/validate.py --staged

        git diff --exit-code -- docs/api/openapi.json docs/diagrams/database.mmd docs/public/examples.md

        '
    - name: Verify emitted favicon link and bundled icon
      run: "python3 - <<'PYTHON'\nfrom html.parser import HTMLParser\nfrom pathlib import Path\nclass Icons(HTMLParser):\n\
        \    found = False\n    def handle_starttag(self, tag, attrs):\n        attrs = dict(attrs)\n        if tag == 'link'\
        \ and attrs.get('rel') == 'icon' and attrs.get('href') == '/favicon.ico':\n            self.found = True\napp = Path('onesa-ai-platform-frontend/apps/docs')\n\
        parser = Icons()\nparser.feed((app / 'build-public/index.html').read_text())\nassert parser.found, 'Public index is\
        \ missing the favicon link'\nicon = (app / 'build-public/favicon.ico').read_bytes()\nassert icon == (app / 'static/favicon.ico').read_bytes()\n\
        assert icon[:4] == b'\\x00\\x00\\x01\\x00', 'Invalid ICO header'\nprint('Public index favicon link and bundled image\
        \ verified.')\nPYTHON\n"
    - name: Stop isolated screenshot fixture
      if: always()
      run: docker compose down
    - name: Upload public site only
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: onesa-public-docs-staging
        path: onesa-ai-platform-frontend/apps/docs/build-public/
        if-no-files-found: error
        retention-days: 7
    - name: Prepare separate Vercel documentation project
      if: inputs.target != 'build'
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_DOCS_PROJECT_ID: ${{ secrets.VERCEL_DOCS_PROJECT_ID }}
        APPLICATION_VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        DOCS_DEPLOY_DIRECTORY: ${{ runner.temp }}/onesa-docs
        CREATE_PROJECT: ${{ inputs.create_project }}
      run: 'flags=()

        if [ "$CREATE_PROJECT" = true ]; then flags+=(--create); fi

        .venv/bin/python scripts/docs/vercel_host.py prepare "${flags[@]}"

        '
    - name: Publish verified public build to Vercel
      if: inputs.target != 'build'
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        DEPLOY_TARGET: ${{ inputs.target }}
      run: "set -eu\nmkdir -p \"$RUNNER_TEMP/onesa-docs/.vercel/output/static\"\ncp onesa-ai-platform-frontend/apps/docs/vercel.json\
        \ \"$RUNNER_TEMP/onesa-docs/vercel.json\"\ncp -a onesa-ai-platform-frontend/apps/docs/build-public/. \"$RUNNER_TEMP/onesa-docs/.vercel/output/static/\"\
        \npython3 - <<'PYTHON'\nimport json, os\nfrom pathlib import Path\nroutes = []\nif os.environ['DEPLOY_TARGET'] ==\
        \ 'preview':\n    routes.append({'src': '/(.*)', 'headers': {'X-Robots-Tag': 'noindex, nofollow'}, 'continue': True})\n\
        routes.extend([{'handle': 'filesystem'}, {'src': '/((?:[^/]+/)*[^/.]+)', 'dest': '/$1.html'}, {'src': '/.*', 'dest':\
        \ '/404.html', 'status': 404}])\npath = Path(os.environ['RUNNER_TEMP']) / 'onesa-docs/.vercel/output/config.json'\n\
        path.write_text(json.dumps({'version': 3, 'routes': routes}) + '\\n')\nPYTHON\ncd \"$RUNNER_TEMP/onesa-docs\"\nflags=()\n\
        if [ \"$DEPLOY_TARGET\" = production ]; then flags+=(--prod); fi\nnpm exec --yes --package=vercel@63.1.0 -- vercel\
        \ deploy --prebuilt --yes \"${flags[@]}\" --token=\"$VERCEL_TOKEN\" > \"$RUNNER_TEMP/onesa-docs-url.txt\"\ncat \"\
        $RUNNER_TEMP/onesa-docs-url.txt\" >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: Attach owner-selected public domain and report DNS requirements
      if: inputs.target == 'production'
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        DOCS_DEPLOY_DIRECTORY: ${{ runner.temp }}/onesa-docs
      run: .venv/bin/python scripts/docs/vercel_host.py domain | tee -a "$GITHUB_STEP_SUMMARY"
