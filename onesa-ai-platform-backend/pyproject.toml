[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "onesa-api"
version = "0.1.0"
description = "Onesa AI platform API"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.143.1",
  "pydantic-settings==2.16.0",
  "uvicorn[standard]==0.54.0",
  "SQLAlchemy==2.1.4",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "argon2-cffi==25.1.0",
  "email-validator==2.3.0",
  "pgvector==0.5.1",
  "pypdf==6.21.4",
  "python-multipart==0.0.32",
  "prometheus-client==0.26.0",
  "PyYAML==6.0.3",
  "greenlet==3.5.6",
  "httpx==0.28.1",
  "basyx-python-sdk==2.2.0",
  "paho-mqtt==2.1.0",
  "defusedxml==0.7.1",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "ruff==0.17.0",
  "mypy==2.4.0",
  "pip-tools==7.6.2",
  "pip-audit==2.10.1",
  "types-defusedxml==0.7.0.20260504",
  "setuptools==84.1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["twin_fixture_data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "prometheus_client.*"]
ignore_missing_imports = true
