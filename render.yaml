# HISTORICAL PAID BLUEPRINT: do not apply under the owner free-only policy.
# Use docs/engineering/FREE_STAGING_SETUP.md; no resource has been changed by this file.
# Apply only after provider access, scoped database credentials and launch settings are supplied.
services:
  - type: web
    name: onesa-ai-platform-backend
    runtime: docker
    region: frankfurt
    plan: 1c-2g
    branch: main
    rootDir: onesa-ai-platform-backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh /app/start.sh
    healthCheckPath: /core-ready
    autoDeployTrigger: 'off'
    envVars:
      - key: ONESA_ENVIRONMENT
        value: production
      - key: ONESA_SECURE_COOKIES
        value: 'true'
      - key: ONESA_DATABASE_URL
        sync: false
      - key: ONESA_PUBLIC_ORIGIN
        sync: false
      - key: ONESA_METRICS_TOKEN
        generateValue: true
      - key: ONESA_MODEL_BACKEND
        sync: false
      - key: ONESA_MODEL_NAME
        sync: false
      - key: ONESA_MODEL_BASE_URL
        sync: false
      - key: ONESA_MODEL_API_KEY
        sync: false
      - key: ONESA_EMBEDDING_BACKEND
        value: lexical
      - key: ONESA_AUTH_HASH_CONCURRENCY
        value: '2'
    buildFilter:
      paths: [onesa-ai-platform-backend/**, render.yaml]
databases:
  - name: onesa-ai-platform-db
    region: frankfurt
    plan: 0.5c-1g
    databaseName: onesa
    user: onesa_owner
    postgresMajorVersion: '16'
    ipAllowList: []
