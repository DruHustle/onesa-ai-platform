# Local TLS acceptance only: separate namespace, secrets, DB and CA; no public ports.
services:
  migrate:
    environment:
      ONESA_ENVIRONMENT: staging
  provision:
    build: {context: ./onesa-ai-platform-backend, dockerfile: Dockerfile}
    environment:
      ONESA_ENVIRONMENT: staging
      ONESA_DB_PASSWORD: ${ONESA_DB_PASSWORD:?Use the isolated acceptance env}
      ONESA_APP_DB_PASSWORD: ${ONESA_APP_DB_PASSWORD:?Use isolated app credentials}
      ONESA_BACKUP_DB_PASSWORD: ${ONESA_BACKUP_DB_PASSWORD:?Use isolated backup credentials}
    command: [python, /provision_roles.py]
    volumes: ["./scripts/acceptance/provision_roles.py:/provision_roles.py:ro"]
    depends_on: {migrate: {condition: service_completed_successfully}}
    healthcheck: {disable: true}
  api:
    environment:
      ONESA_ENVIRONMENT: staging
      ONESA_PUBLIC_ORIGIN: https://localhost:3443
      ONESA_AUTH_PEER_RATE_LIMIT: ${ONESA_AUTH_PEER_RATE_LIMIT:-1000}
    depends_on: {provision: {condition: service_completed_successfully}}
  proxy:
    ports: !override ["127.0.0.1:3443:443"]
    volumes: !override ["./infra/proxy/Caddyfile.acceptance:/etc/caddy/Caddyfile:ro", "caddy-data:/data", "caddy-config:/config"]
    depends_on: {chat: {condition: service_healthy}}
  monitoring:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    command: ["--config.file=/etc/prometheus/prometheus.yaml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d"]
    volumes: ["./infra/monitoring/acceptance-prometheus.yaml:/etc/prometheus/prometheus.yaml:ro", "./infra/monitoring/acceptance-alerts.yaml:/etc/prometheus/alerts.yaml:ro", "prometheus-data:/prometheus"]
    secrets: [metrics_token, operations_token]
    ports: ["127.0.0.1:9095:9090"]
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    command: ["--config.file=/etc/alertmanager/alertmanager.yaml", "--storage.path=/alertmanager"]
    volumes: ["./infra/monitoring/acceptance-alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro", "alertmanager-data:/alertmanager"]
    secrets: [operations_token]
    ports: ["127.0.0.1:9096:9093"]
    restart: unless-stopped
  operations:
    build: {context: ./infra/operations, dockerfile: Dockerfile}
    environment:
      ONESA_BACKUP_INTERVAL_SECONDS: ${ONESA_BACKUP_INTERVAL_SECONDS:-3600}
      ONESA_BACKUP_RETENTION_DAYS: ${ONESA_BACKUP_RETENTION_DAYS:-7}
    secrets: [backup_pgpass, backup_key, operations_token]
    volumes: [backups:/backups, operations-state:/state]
    ports: ["127.0.0.1:9905:9000"]
    depends_on: {provision: {condition: service_completed_successfully}}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    restart: unless-stopped
  restore:
    profiles: [recovery]
    build: {context: ./infra/operations, dockerfile: Dockerfile}
    environment: {ONESA_PG_USER: onesa}
    secrets: [backup_pgpass, owner_pgpass, backup_key]
    volumes: [backups:/backups:ro]
    command: [python, /app/worker.py, restore]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
secrets:
  metrics_token: {file: ./data/acceptance-005/secrets/metrics_token}
  operations_token: {file: ./data/acceptance-005/secrets/operations_token}
  backup_pgpass: {file: ./data/acceptance-005/secrets/backup.pgpass}
  owner_pgpass: {file: ./data/acceptance-005/secrets/owner.pgpass}
  backup_key: {file: ./data/acceptance-005/secrets/backup_key}
volumes:
  prometheus-data:
  alertmanager-data:
  backups:
  operations-state:
